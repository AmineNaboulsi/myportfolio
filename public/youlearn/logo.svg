<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="YouLearn">
  <title>YouLearn</title>
  <style>
    :root { color-scheme: light dark; }
    .bg { fill: #ffffff; }
    .fg { fill: #0a0a0a; }
    .line { stroke: #e5e5e5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1120; }
      .fg { fill: #e5e7eb; }
      .line { stroke: #1f2937; }
    }
  </style>

  <rect class="bg" x="0.75" y="0.75" width="62.5" height="62.5" rx="14" />
  <rect class="line" x="0.75" y="0.75" width="62.5" height="62.5" rx="14" fill="none" stroke-width="1.5" />

  <!-- The grid motif the platform uses behind its empty states. -->
  <g class="line" stroke-width="1" opacity="0.7">
    <path d="M16 8 V56 M32 8 V56 M48 8 V56" />
    <path d="M8 16 H56 M8 32 H56 M8 48 H56" />
  </g>

  <!-- A play triangle sitting in a Y: a course platform whose unit is a video. -->
  <g class="fg">
    <path d="M18 18 L28.5 30 L28.5 46 L35.5 46 L35.5 30 L46 18 L37.5 18 L32 25 L26.5 18 Z" />
  </g>
</svg>
